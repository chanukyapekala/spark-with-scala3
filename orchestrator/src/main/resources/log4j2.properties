# Log4j2 configuration for Orchestrator
status=warn
name=OrchestratorConfig

# Console appender
appender.console.type=Console
appender.console.name=ConsoleAppender
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Root logger
rootLogger.level=info
rootLogger.appenderRef.stdout.ref=ConsoleAppender

# Orchestrator logger
logger.orchestrator.name=orchestrator
logger.orchestrator.level=info
logger.orchestrator.appenderRef.stdout.ref=ConsoleAppender

# ZIO logging
logger.zio.name=zio
logger.zio.level=info
logger.zio.appenderRef.stdout.ref=ConsoleAppender