# Log4j2 Configuration for Flink Streaming Job
# Set root logger level and appenders
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console appender configuration
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%-5p] (%F:%L) %m%n

# Flink-specific loggers
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Kafka connector logger
logger.kafka.name = org.apache.kafka
logger.kafka.level = INFO

# Parquet logger
logger.parquet.name = org.apache.parquet
logger.parquet.level = INFO

# Hadoop logger
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

# Application logger
logger.app.name = flink
logger.app.level = DEBUG