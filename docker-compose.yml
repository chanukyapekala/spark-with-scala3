services:
  # PostgreSQL database for Hive Metastore
  postgres:
    image: postgres:15-alpine
    container_name: scala3-spark-postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-hive-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hive Metastore Service
  hive-metastore:
    build:
      context: ./docker
      dockerfile: Dockerfile.hive
    container_name: scala3-spark-hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                     -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
                     -Djavax.jdo.option.ConnectionUserName=hive
                     -Djavax.jdo.option.ConnectionPassword=hive"
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark-network
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Scala 3 + Spark Application
  spark-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scala3-spark-app
    environment:
      - SPARK_MASTER=local[*]
      - HIVE_METASTORE_URIS=thrift://hive-metastore:9083
    depends_on:
      hive-metastore:
        condition: service_healthy
    networks:
      - spark-network
    volumes:
      - ./data:/app/data
      - spark-warehouse:/app/spark-warehouse
    ports:
      - "4040:4040"  # Spark UI
    stdin_open: true
    tty: true

  # Spark Master (Optional - for cluster mode)
  spark-master:
    image: apache/spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: scala3-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"  # Master Web UI
      - "7077:7077"  # Master port
    networks:
      - spark-network
    profiles:
      - cluster

  # Spark Worker (Optional - for cluster mode)
  spark-worker:
    image: apache/spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: scala3-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    ports:
      - "8081:8081"  # Worker Web UI
    networks:
      - spark-network
    profiles:
      - cluster

networks:
  spark-network:
    driver: bridge

volumes:
  postgres-data:
  hive-warehouse:
  spark-warehouse:
